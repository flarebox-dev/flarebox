#
# XcodeGen spec for Koidrive.xcodeproj. Generate the project with scripts/generate-project.sh.

name: Koidrive
options:
  bundleIdPrefix: dev.koidrive
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  KoidriveFFI:
    path: KoidriveFFI
targets:
  Koidrive:
    type: application
    platform: macOS
    sources:
      - Koidrive
    info:
      path: build/Info.plist
      properties:
        KoidriveVersion: $(KOIDRIVE_VERSION)
    dependencies:
      - package: KoidriveFFI
        product: KoidriveFFI
      - package: KoidriveFFI
        product: KoidriveModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.koidrive.Koidrive
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Koidrive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: 0.1.0
        KOIDRIVE_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: 6.0
        ONLY_ACTIVE_ARCH: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
schemes:
  Koidrive:
    build:
      targets:
        Koidrive: all
