# SPDX-License-Identifier: Apache-2.0

name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: deploy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: site
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read
      pull-requests: write
    env:
      PROJECT: koidrive-site
      WRANGLER_VERSION: 4.160.0
    steps:
      - name: Check for the Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=()
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            message="Deploy skipped: the site environment has no ${missing[*]} secret. Add it under Settings > Environments > site, then re-run this job."
            echo "::notice title=Site deploy skipped::$message"
            echo "$message" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: site
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Deploy site/ to Cloudflare Pages
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
        run: |
          npx --yes "wrangler@$WRANGLER_VERSION" pages deploy site \
            --project-name "$PROJECT" --branch "$BRANCH" --commit-hash "$SHA"
          url="$(jq -r 'select(.type == "pages-deploy-detailed") | .alias // .url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)"
          if [ -z "$url" ]; then
            echo "::error::wrangler reported no deployment URL in $WRANGLER_OUTPUT_FILE_PATH:"
            cat "$WRANGLER_OUTPUT_FILE_PATH"
            exit 1
          fi
          echo "Deployed $SHA from $BRANCH to $url"
          echo "Deployed \`$SHA\` from \`$BRANCH\` to $url" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Post the preview URL on the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          marker='<!-- site-preview -->'
          body="$(printf '%s\nSite preview for %s: %s\n' "$marker" "$SHA" "$URL")"
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | sed -n 1p)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$body" --jq .html_url
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$body" --jq .html_url
          fi
