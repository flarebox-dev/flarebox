# SPDX-License-Identifier: Apache-2.0

name: DCO

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - name: Skip in the merge queue
        if: github.event_name == 'merge_group'
        run: echo "Every commit was already checked for a sign-off on its pull request; merge_group events carry no pull request commit range."
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            if git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qxF "$author"; then
              echo "ok    $sha  $author"
            else
              echo "::error::Commit $sha has no 'Signed-off-by: $author' line matching its author. Sign off with 'git rebase --signoff $BASE' and force-push. See CONTRIBUTING.md."
              status=1
            fi
          done
          exit $status
