# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_macos: ${{ steps.paths.outputs.rust_macos }}
      server_macos: ${{ steps.paths.outputs.server_macos }}
      spec_macos: ${{ steps.paths.outputs.spec_macos }}
      macos_app: ${{ steps.paths.outputs.macos_app }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which macOS jobs the change needs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "Push to $GITHUB_REF: every macOS job runs."
            printf '%s=true\n' rust_macos server_macos spec_macos macos_app >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! changed="$(git diff --name-only --no-renames "$BASE" HEAD)"; then
            echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
            exit 1
          fi
          echo "Files this $EVENT run changes against $BASE:"
          printf '%s\n' "$changed"
          decide() {
            if grep -Eq "$2" <<<"$changed"; then
              echo "$1: runs, because a changed file matches $2"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1: skipped, because no changed file matches $2"
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide rust_macos '^(\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|cli/|core/|spec/)'
          echo "server_macos, spec_macos: skipped, because the server and spec checks run on macOS only on pushes to main"
          printf '%s=false\n' server_macos spec_macos >> "$GITHUB_OUTPUT"
          decide macos_app '^(\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|cli/Cargo\.toml$|rust-toolchain\.toml$|\.cargo/|core/|apps/macos/)'

  rust:
    name: rust (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    name: server (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.server_macos == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=verbose
      - name: Test the deploy-test scripts against a mocked Cloudflare API
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose run.unit

  server-deploy:
    name: server deploy check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Deploy a copy of server/ on its own (dry run, then wrangler dev and a claim)
        run: node server/scripts/check-deploy.mjs
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Pack the server bundle that the CLI embeds
        run: node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
      - name: Check that the packer replaces nothing in its output
        run: node --test server/scripts/check-pack-bundle.mjs

  net-integration:
    name: net integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test flarebox-net against the Worker under wrangler dev
        run: core/net/scripts/integration-test.sh

  cli-integration:
    name: cli integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the flarebox command and daemon against the Worker under wrangler dev
        run: cli/scripts/integration-test.sh

  ffi-integration:
    name: ffi integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the app's session against the Worker under wrangler dev
        run: core/ffi/scripts/integration-test.sh

  spec:
    name: spec (${{ matrix.os }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.spec_macos == 'true' && '["ubuntu-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- ../server/src/gen ../core/proto/src/gen || [ -n "$(git status --porcelain -- ../server/src/gen ../core/proto/src/gen)" ]; then
            echo "::error::Generated code in server/src/gen or core/proto/src/gen is out of date. Run 'buf generate' in spec/ and commit the result."
            git status --short -- ../server/src/gen ../core/proto/src/gen
            exit 1
          fi
      - name: Check for breaking changes against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'refs/heads/main' }}
        run: |
          git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/breaking-base"
          if ! buf breaking --against "../.git#ref=refs/remotes/origin/breaking-base,subdir=spec"; then
            echo "::error::The schema in spec/proto breaks compatibility with the base $BASE (see the buf output above). Keep field numbers, names and types stable; reserve removed fields instead of deleting them."
            exit 1
          fi

  macos-app:
    name: macos app
    needs: changes
    if: needs.changes.outputs.macos_app == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test notarize.sh against a stub notarytool
        run: scripts/test-notarize.sh
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show Xcode and Swift versions
        run: xcodebuild -version && swift --version
      - name: Build the Rust core, the Swift bindings and the app (unsigned)
        run: scripts/build-release.sh
      - name: Test the Swift bindings
        run: swift test --package-path FlareboxFFI
      - name: Test the Swift bindings in the release configuration, which has no DEBUG condition
        run: swift test --package-path FlareboxFFI -c release
      - name: Check the app bundle
        run: plutil -p build/release/Flarebox.app/Contents/Info.plist
      - name: Sign the app ad hoc (pull requests are never signed with the Developer ID)
        run: scripts/sign-app.sh build/release/Flarebox.app -
      - name: Package the disk image
        run: scripts/make-dmg.sh build/release/Flarebox.app build/release/Flarebox-unsigned.dmg
      - name: Verify the disk image
        run: |
          scripts/verify-release.sh build/release/Flarebox-unsigned.dmg unsigned
          echo "Unsigned build: pull requests and the merge queue never sign or notarize. SHA-256 $(shasum -a 256 build/release/Flarebox-unsigned.dmg | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flarebox-unsigned
          path: apps/macos/build/release/Flarebox-unsigned.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  ci-report:
    name: ci-report
    if: always()
    needs: [changes, rust, server, server-deploy, net-integration, cli-integration, ffi-integration, spec, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST: ${{ needs.rust.result }}
          SERVER: ${{ needs.server.result }}
          SERVER_DEPLOY: ${{ needs.server-deploy.result }}
          NET_INTEGRATION: ${{ needs.net-integration.result }}
          CLI_INTEGRATION: ${{ needs.cli-integration.result }}
          FFI_INTEGRATION: ${{ needs.ffi-integration.result }}
          SPEC: ${{ needs.spec.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "changes: $CHANGES, rust: $RUST, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled (changes: $CHANGES, rust: $RUST, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP). Open that job's log for the cause."
            exit 1
          fi
      - name: Fail unless every macOS job ran on a push to main
        if: github.event_name == 'push'
        env:
          RUST_MACOS: ${{ needs.changes.outputs.rust_macos }}
          SERVER_MACOS: ${{ needs.changes.outputs.server_macos }}
          SPEC_MACOS: ${{ needs.changes.outputs.spec_macos }}
          MACOS_APP_WANTED: ${{ needs.changes.outputs.macos_app }}
          MACOS_APP: ${{ needs.macos-app.result }}
        run: |
          echo "macOS jobs on this push: rust $RUST_MACOS, server $SERVER_MACOS, spec $SPEC_MACOS, macos app $MACOS_APP_WANTED ($MACOS_APP)"
          if [ "$RUST_MACOS" != true ] || [ "$SERVER_MACOS" != true ] || [ "$SPEC_MACOS" != true ] || [ "$MACOS_APP_WANTED" != true ] || [ "$MACOS_APP" != success ]; then
            echo "::error::A push to main must run and pass every macOS job, but rust ${RUST_MACOS:-unknown}, server ${SERVER_MACOS:-unknown}, spec ${SPEC_MACOS:-unknown}, macos app ${MACOS_APP_WANTED:-unknown} ($MACOS_APP). Only pull requests and the merge queue may skip a macOS job."
            exit 1
          fi
