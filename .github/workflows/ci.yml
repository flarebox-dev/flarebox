# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=verbose

  net-integration:
    name: net integration (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test flarebox-net against the Worker under wrangler dev
        run: core/net/scripts/integration-test.sh

  spec:
    name: spec (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- ../server/src/gen ../core/proto/src/gen || [ -n "$(git status --porcelain -- ../server/src/gen ../core/proto/src/gen)" ]; then
            echo "::error::Generated code in server/src/gen or core/proto/src/gen is out of date. Run 'buf generate' in spec/ and commit the result."
            git status --short -- ../server/src/gen ../core/proto/src/gen
            exit 1
          fi
      - name: Check for breaking changes against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'refs/heads/main' }}
        run: |
          git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/breaking-base"
          if ! buf breaking --against "../.git#ref=refs/remotes/origin/breaking-base,subdir=spec"; then
            echo "::error::The schema in spec/proto breaks compatibility with the base $BASE (see the buf output above). Keep field numbers, names and types stable; reserve removed fields instead of deleting them."
            exit 1
          fi

  macos-app:
    name: macos app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check whether the change affects the macOS app
        id: changes
        working-directory: ${{ github.workspace }}
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = "push" ]; then
            echo "Push to main: building the macOS app."
            echo "affected=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          status=0
          git diff --quiet --no-renames "$BASE" HEAD -- \
            apps/macos core Cargo.toml Cargo.lock rust-toolchain.toml .github/workflows/ci.yml || status=$?
          case "$status" in
            0)
              echo "The change does not touch apps/macos, core, the Cargo files or ci.yml: skipping the macOS app build."
              echo "affected=false" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "The change touches apps/macos, core, the Cargo files or ci.yml: building the macOS app."
              echo "affected=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::git diff between $BASE and HEAD failed with exit code $status, so the affected paths are unknown."
              exit 1
              ;;
          esac
      - name: Install toolchain from rust-toolchain.toml
        if: steps.changes.outputs.affected == 'true'
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.affected == 'true'
      - name: Show Xcode and Swift versions
        if: steps.changes.outputs.affected == 'true'
        run: xcodebuild -version && swift --version
      - name: Build the Rust core and generate the Swift bindings
        if: steps.changes.outputs.affected == 'true'
        run: scripts/build-ffi.sh
      - name: Test the Swift bindings
        if: steps.changes.outputs.affected == 'true'
        run: swift test --package-path FlareboxFFI
      - name: Generate the Xcode project with the pinned XcodeGen
        if: steps.changes.outputs.affected == 'true'
        run: scripts/generate-project.sh
      - name: Build the app (unsigned)
        if: steps.changes.outputs.affected == 'true'
        run: >-
          xcodebuild -project Flarebox.xcodeproj -scheme Flarebox -configuration Release
          -derivedDataPath build/DerivedData -destination "platform=macOS,arch=$(uname -m)"
          CODE_SIGNING_ALLOWED=NO build
      - name: Check the app bundle
        if: steps.changes.outputs.affected == 'true'
        run: |
          app=build/DerivedData/Build/Products/Release/Flarebox.app
          if [ ! -x "$app/Contents/MacOS/Flarebox" ]; then
            echo "::error::xcodebuild reported success but $app/Contents/MacOS/Flarebox is missing."
            exit 1
          fi
          plutil -p "$app/Contents/Info.plist"

  ci-report:
    name: ci-report
    if: always()
    needs: [rust, server, net-integration, spec, macos-app]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          RUST: ${{ needs.rust.result }}
          SERVER: ${{ needs.server.result }}
          NET_INTEGRATION: ${{ needs.net-integration.result }}
          SPEC: ${{ needs.spec.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "rust: $RUST, server: $SERVER, net-integration: $NET_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled (rust: $RUST, server: $SERVER, net-integration: $NET_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP). Open that job's log for the cause."
            exit 1
          fi
