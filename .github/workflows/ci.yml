# SPDX-License-Identifier: Apache-2.0

name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust_macos: ${{ steps.paths.outputs.rust_macos }}
      server_macos: ${{ steps.paths.outputs.server_macos }}
      spec_macos: ${{ steps.paths.outputs.spec_macos }}
      macos_app: ${{ steps.paths.outputs.macos_app }}
      site_only: ${{ steps.paths.outputs.site_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which jobs the change needs
        id: paths
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ]; then
            echo "Push to $GITHUB_REF: every macOS job runs."
            printf '%s=true\n' rust_macos server_macos spec_macos macos_app >> "$GITHUB_OUTPUT"
            echo "site_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE"
          if ! changed="$(git diff --name-only --no-renames "$BASE" HEAD)"; then
            echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
            exit 1
          fi
          echo "Files this $EVENT run changes against $BASE:"
          printf '%s\n' "$changed"
          if [ -n "$changed" ] && ! grep -qv '^site/' <<<"$changed"; then
            echo "site_only: true, because every changed file is under site/, so the build and test jobs skip."
            echo "site_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "site_only: false, because a changed file is outside site/."
            echo "site_only=false" >> "$GITHUB_OUTPUT"
          fi
          decide() {
            if grep -Eq "$2" <<<"$changed"; then
              echo "$1: runs, because a changed file matches $2"
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1: skipped, because no changed file matches $2"
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          decide rust_macos '^(\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$|\.cargo/|cli/|core/|spec/)'
          echo "server_macos, spec_macos: skipped, because the server and spec checks run on macOS only on pushes to main"
          printf '%s=false\n' server_macos spec_macos >> "$GITHUB_OUTPUT"
          decide macos_app '^(\.github/workflows/ci\.yml$|Cargo\.(toml|lock)$|cli/Cargo\.toml$|rust-toolchain\.toml$|\.cargo/|core/|apps/macos/)'

  pick-macos:
    name: pick-macos
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      macos_app: ${{ steps.pick.outputs.macos_app }}
      rust: ${{ steps.pick.outputs.rust }}
      server: ${{ steps.pick.outputs.server }}
      spec: ${{ steps.pick.outputs.spec }}
      runner_hook: ${{ steps.pick.outputs.runner_hook }}
    steps:
      - name: Pick a runner for each macOS job
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          RUNS_ON: ${{ vars.MACOS_RUNS_ON || '["self-hosted","flarebox-mini"]' }}
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          WANTED: macos_app=${{ needs.changes.outputs.macos_app }} rust=${{ needs.changes.outputs.rust_macos }} server=${{ needs.changes.outputs.server_macos }} spec=${{ needs.changes.outputs.spec_macos }} runner_hook=${{ needs.changes.outputs.site_only != 'true' }}
        run: |
          hosted='["xcode-27"]'
          pool=false
          idle=n/a
          total=n/a
          if [ "$EVENT" = pull_request ] && { [ "$REPO" != koidrive/koidrive ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            reason="Pull request in $REPO from ${HEAD_REPO:-a deleted repository}: its macOS jobs run on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<<"$RUNS_ON" >/dev/null 2>&1; then
            echo "::error::The MACOS_RUNS_ON variable must be a JSON array of runner labels, such as [\"xcode-27\"], but it is: $RUNS_ON"
            exit 1
          elif [ "$EVENT" != pull_request ]; then
            reason="A $EVENT run keeps the configured macOS runners."
          elif ! jq -e 'index("self-hosted")' <<<"$RUNS_ON" >/dev/null; then
            reason="MACOS_RUNS_ON is $RUNS_ON, which names no self-hosted runner, so there is nothing to pool."
          elif [ -z "$RUNNER_STATUS_TOKEN" ]; then
            reason="The RUNNER_STATUS_TOKEN secret is not set, so the self-hosted runners cannot be checked and every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! runners="$(curl -fsS --max-time 15 -H "Authorization: Bearer $RUNNER_STATUS_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' "$GITHUB_API_URL/repos/$REPO/actions/runners?per_page=100")"; then
            reason="Listing the self-hosted runners failed (see the curl error above), so every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          elif ! counts="$(jq -er --argjson want "$RUNS_ON" '[.runners[] | select(($want | map(ascii_downcase)) - [.labels[].name | ascii_downcase] == [])] | "\(map(select(.status == "online" and .busy == false)) | length) \(length)"' <<<"$runners" 2>&1)"; then
            reason="The runner list is not in the expected shape ($counts), so every macOS job runs on GitHub-hosted runners."
            RUNS_ON=$hosted
          else
            read -r idle total <<<"$counts"
            pool=true
            reason="$idle of the $total self-hosted runners labelled $RUNS_ON are online and idle, so at most $idle macOS jobs run there and the rest on GitHub-hosted runners."
          fi
          RUNS_ON="$(jq -c . <<<"$RUNS_ON")"
          echo "$reason"
          {
            echo "### macOS runners"
            echo
            echo "$reason"
            echo
            echo "| Job | Runs | Runner labels | DEVELOPER_DIR |"
            echo "| --- | --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          to_self_hosted=0
          to_hosted=0
          for job in macos_app rust server spec runner_hook; do
            case " $WANTED " in
              *" $job=true "*) wanted=true ;;
              *) wanted=false ;;
            esac
            runs_on=$RUNS_ON
            if [ "$pool" = true ] && { [ "$wanted" != true ] || [ "$to_self_hosted" -ge "$idle" ]; }; then
              runs_on=$hosted
            fi
            if jq -e 'index("self-hosted")' <<<"$runs_on" >/dev/null; then
              developer_dir=/Applications/Xcode.app/Contents/Developer
              if [ "$wanted" = true ]; then to_self_hosted=$((to_self_hosted + 1)); fi
            else
              developer_dir=/Applications/Xcode_27.2.app/Contents/Developer
              if [ "$wanted" = true ]; then to_hosted=$((to_hosted + 1)); fi
            fi
            echo "$job: runs $wanted, on $runs_on with DEVELOPER_DIR=$developer_dir"
            echo "| $job | $wanted | \`$runs_on\` | \`$developer_dir\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "$job=$(jq -nc --argjson runs_on "$runs_on" --arg developer_dir "$developer_dir" '{runs_on: $runs_on, developer_dir: $developer_dir}')" >> "$GITHUB_OUTPUT"
          done
          decision="pick-macos: event=$EVENT pooled=$pool idle=$idle total=$total to_self_hosted=$to_self_hosted to_hosted=$to_hosted"
          echo "$decision"
          printf '\n%s\n' "$decision" >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: rust (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.rust_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.rust).runs_on || matrix.os }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.rust).developer_dir || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Homebrew's rustup with rustup and Cargo homes private to this self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          printf 'RUSTUP_HOME=%s\nCARGO_HOME=%s\n' "$RUNNER_TOOL_CACHE/rustup" "$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "Runner $RUNNER_NAME uses RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup and CARGO_HOME=$RUNNER_TOOL_CACHE/cargo."
          proxies=/opt/homebrew/opt/rustup/bin
          if [ ! -x "$proxies/cargo" ] || [ ! -x "$proxies/rustc" ]; then
            echo "::error::Runner $RUNNER_NAME has no cargo or rustc in $proxies. Install rustup with Homebrew (brew install rustup) on the Mac that hosts the runners."
            exit 1
          fi
          echo "$proxies" >> "$GITHUB_PATH"
          echo "Runner $RUNNER_NAME takes cargo and rustc from $proxies."
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  server:
    name: server (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.server_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.server).runs_on || matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.server).developer_dir || '' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test --reporter=verbose
      - name: Test the deploy-test scripts against a mocked Cloudflare API
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose run.unit

  server-deploy:
    name: server deploy check
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Deploy a copy of server/ on its own (dry run, then wrangler dev and a claim)
        run: node server/scripts/check-deploy.mjs
      - name: Install server dependencies
        working-directory: server
        run: pnpm install --frozen-lockfile
      - name: Pack the server bundle that the CLI embeds
        run: node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
      - name: Check that the packer replaces nothing in its output
        run: node --test server/scripts/check-pack-bundle.mjs

  net-integration:
    name: net integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test koidrive-net against the Worker under wrangler dev
        run: core/net/scripts/integration-test.sh

  driver-integration:
    name: driver integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test two drivers against the Worker under wrangler dev
        run: core/driver/scripts/integration-test.sh

  cli-integration:
    name: cli integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the koi command and daemon against the Worker under wrangler dev
        run: cli/scripts/integration-test.sh

  ffi-integration:
    name: ffi integration (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: server
      - name: Test the app's session against the Worker under wrangler dev
        run: core/ffi/scripts/integration-test.sh

  spec:
    name: spec (${{ matrix.os }})
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.changes.outputs.spec_macos == 'true' && '["ubuntu-latest","macos"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.spec).runs_on || matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.os == 'macos' && fromJSON(needs.pick-macos.outputs.spec).developer_dir || '' }}
    defaults:
      run:
        working-directory: spec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bufbuild/buf-action@37ac33d8960807670a6e9719080e885197b09cc6 # v1.7.0
        with:
          version: 1.75.0
          setup_only: true
      - run: buf lint
      - name: Check generated code is up to date
        run: |
          buf generate
          if ! git diff --exit-code -- ../server/src/gen ../core/proto/src/gen || [ -n "$(git status --porcelain -- ../server/src/gen ../core/proto/src/gen)" ]; then
            echo "::error::Generated code in server/src/gen or core/proto/src/gen is out of date. Run 'buf generate' in spec/ and commit the result."
            git status --short -- ../server/src/gen ../core/proto/src/gen
            exit 1
          fi
      - name: Check for breaking changes against the base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || 'refs/heads/main' }}
        run: |
          git fetch --no-tags --depth=1 origin "+$BASE:refs/remotes/origin/breaking-base"
          if ! buf breaking --against "../.git#ref=refs/remotes/origin/breaking-base,subdir=spec"; then
            echo "::error::The schema in spec/proto breaks compatibility with the base $BASE (see the buf output above). Keep field numbers, names and types stable; reserve removed fields instead of deleting them."
            exit 1
          fi

  macos-app:
    name: macos app
    needs: [changes, pick-macos]
    if: needs.changes.outputs.macos_app == 'true'
    runs-on: ${{ fromJSON(needs.pick-macos.outputs.macos_app).runs_on }}
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: ${{ fromJSON(needs.pick-macos.outputs.macos_app).developer_dir }}
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Homebrew's rustup with rustup and Cargo homes private to this self-hosted runner
        if: runner.environment == 'self-hosted'
        run: |
          printf 'RUSTUP_HOME=%s\nCARGO_HOME=%s\n' "$RUNNER_TOOL_CACHE/rustup" "$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
          echo "Runner $RUNNER_NAME uses RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup and CARGO_HOME=$RUNNER_TOOL_CACHE/cargo."
          proxies=/opt/homebrew/opt/rustup/bin
          if [ ! -x "$proxies/cargo" ] || [ ! -x "$proxies/rustc" ]; then
            echo "::error::Runner $RUNNER_NAME has no cargo or rustc in $proxies. Install rustup with Homebrew (brew install rustup) on the Mac that hosts the runners."
            exit 1
          fi
          echo "$proxies" >> "$GITHUB_PATH"
          echo "Runner $RUNNER_NAME takes cargo and rustc from $proxies."
      - name: Test notarize.sh against a stub notarytool
        run: scripts/test-notarize.sh
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Show Xcode and Swift versions
        run: xcodebuild -version && swift --version
      - name: Build the Rust core, the Swift bindings and the app (unsigned)
        run: scripts/build-release.sh
      - name: Test the Swift bindings
        run: swift test --package-path KoidriveFFI
      - name: Test the Swift bindings in the release configuration, which has no DEBUG condition
        run: swift test --package-path KoidriveFFI -c release
      - name: Check the app bundle
        run: plutil -p build/release/Koidrive.app/Contents/Info.plist
      - name: Sign the app ad hoc (pull requests are never signed with the Developer ID)
        run: scripts/sign-app.sh build/release/Koidrive.app -
      - name: Package the disk image
        run: scripts/make-dmg.sh build/release/Koidrive.app build/release/Koidrive-unsigned.dmg
      - name: Verify the disk image
        run: |
          scripts/verify-release.sh build/release/Koidrive-unsigned.dmg unsigned
          echo "Unsigned build: pull requests and the merge queue never sign or notarize. SHA-256 $(shasum -a 256 build/release/Koidrive-unsigned.dmg | cut -d ' ' -f 1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Koidrive-unsigned
          path: apps/macos/build/release/Koidrive-unsigned.dmg
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  runner-hook:
    name: runner hook
    needs: [changes, pick-macos]
    if: needs.changes.outputs.site_only != 'true'
    runs-on: ${{ fromJSON(needs.pick-macos.outputs.runner_hook).runs_on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test the job-started hook of the self-hosted runners
        run: .github/runner/test-job-started.sh
      - name: Test the hook's installer without root
        run: .github/runner/test-install-hook.sh

  ci-report:
    name: ci-report
    if: always()
    needs: [changes, pick-macos, rust, server, server-deploy, net-integration, driver-integration, cli-integration, ffi-integration, spec, macos-app, runner-hook]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any CI job failed or was cancelled
        env:
          CHANGES: ${{ needs.changes.result }}
          PICK_MACOS: ${{ needs.pick-macos.result }}
          SITE_ONLY: ${{ needs.changes.outputs.site_only }}
          RUST: ${{ needs.rust.result }}
          SERVER: ${{ needs.server.result }}
          SERVER_DEPLOY: ${{ needs.server-deploy.result }}
          NET_INTEGRATION: ${{ needs.net-integration.result }}
          DRIVER_INTEGRATION: ${{ needs.driver-integration.result }}
          CLI_INTEGRATION: ${{ needs.cli-integration.result }}
          FFI_INTEGRATION: ${{ needs.ffi-integration.result }}
          SPEC: ${{ needs.spec.result }}
          MACOS_APP: ${{ needs.macos-app.result }}
          RUNNER_HOOK: ${{ needs.runner-hook.result }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "site-only change: ${SITE_ONLY:-unknown}. Build and test jobs that skip for a site-only change report skipped."
          echo "changes: $CHANGES, pick-macos: $PICK_MACOS, rust: $RUST, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, runner-hook: $RUNNER_HOOK"
          if [ "$FAILED" = "true" ]; then
            echo "::error::At least one CI job failed or was cancelled (changes: $CHANGES, pick-macos: $PICK_MACOS, rust: $RUST, server: $SERVER, server-deploy: $SERVER_DEPLOY, net-integration: $NET_INTEGRATION, driver-integration: $DRIVER_INTEGRATION, cli-integration: $CLI_INTEGRATION, ffi-integration: $FFI_INTEGRATION, spec: $SPEC, macos-app: $MACOS_APP, runner-hook: $RUNNER_HOOK). Open that job's log for the cause."
            exit 1
          fi
      - name: Fail unless the build and test jobs ran for a change outside site/
        if: needs.changes.outputs.site_only != 'true'
        env:
          RESULTS: rust=${{ needs.rust.result }} server=${{ needs.server.result }} server-deploy=${{ needs.server-deploy.result }} net-integration=${{ needs.net-integration.result }} driver-integration=${{ needs.driver-integration.result }} cli-integration=${{ needs.cli-integration.result }} ffi-integration=${{ needs.ffi-integration.result }} spec=${{ needs.spec.result }} runner-hook=${{ needs.runner-hook.result }}
        run: |
          echo "Build and test jobs for a change outside site/: $RESULTS"
          for r in $RESULTS; do
            if [ "${r#*=}" != success ]; then
              echo "::error::A change outside site/ must run and pass every build and test job, but ${r%%=*} is ${r#*=}. Only a change whose files are all under site/ may skip them."
              exit 1
            fi
          done
      - name: Fail unless every macOS job ran on a push to main
        if: github.event_name == 'push'
        env:
          RUST_MACOS: ${{ needs.changes.outputs.rust_macos }}
          SERVER_MACOS: ${{ needs.changes.outputs.server_macos }}
          SPEC_MACOS: ${{ needs.changes.outputs.spec_macos }}
          MACOS_APP_WANTED: ${{ needs.changes.outputs.macos_app }}
          MACOS_APP: ${{ needs.macos-app.result }}
        run: |
          echo "macOS jobs on this push: rust $RUST_MACOS, server $SERVER_MACOS, spec $SPEC_MACOS, macos app $MACOS_APP_WANTED ($MACOS_APP)"
          if [ "$RUST_MACOS" != true ] || [ "$SERVER_MACOS" != true ] || [ "$SPEC_MACOS" != true ] || [ "$MACOS_APP_WANTED" != true ] || [ "$MACOS_APP" != success ]; then
            echo "::error::A push to main must run and pass every macOS job, but rust ${RUST_MACOS:-unknown}, server ${SERVER_MACOS:-unknown}, spec ${SPEC_MACOS:-unknown}, macos app ${MACOS_APP_WANTED:-unknown} ($MACOS_APP). Only pull requests and the merge queue may skip a macOS job."
            exit 1
          fi
