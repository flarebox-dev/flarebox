# SPDX-License-Identifier: Apache-2.0

name: Installer

# koidrive.com is built from the koidrive/site repository, which downloads install.sh from this repository's main.
# When install.sh changes on main, this redeploys the site through its deploy hook and checks that
# https://koidrive.com/install.sh serves main's install.sh. A pull request that changes this workflow runs the check alone.

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
  pull_request:
    paths:
      - ".github/workflows/installer.yml"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production:
    name: koidrive.com
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      URL: https://koidrive.com/install.sh
    steps:
      - name: Redeploy koidrive.com once raw.githubusercontent.com serves main's install.sh
        if: github.event_name == 'push'
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$SITE_DEPLOY_HOOK" ]; then
            echo "::error::The SITE_DEPLOY_HOOK secret is not set, so koidrive.com cannot be redeployed."
            exit 1
          fi
          expected="$RUNNER_TEMP/expected-install.sh" raw="$RUNNER_TEMP/raw-install.sh"
          main=
          for attempt in $(seq 1 40); do
            latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$latest" != "$main" ]; then
              main=$latest
              gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/install.sh?ref=$main" >"$expected"
            fi
            curl --silent --max-time 20 --output "$raw" "https://raw.githubusercontent.com/$REPO/main/install.sh" || true
            cmp -s "$expected" "$raw" && break
            [ "$attempt" -lt 40 ] || { echo "::error::raw.githubusercontent.com did not serve install.sh at $main after 40 attempts."; exit 1; }
            sleep 15
          done
          curl --fail --silent --show-error --max-time 30 --request POST --output /dev/null "$SITE_DEPLOY_HOOK"
          echo "raw.githubusercontent.com serves install.sh at $main; triggered a koidrive.com deploy."
      - name: Check that koidrive.com serves main's install.sh
        run: |
          served="$RUNNER_TEMP/served-install.sh" headers="$RUNNER_TEMP/served-install.headers" expected="$RUNNER_TEMP/main-install.sh"
          main=
          for attempt in $(seq 1 60); do
            latest="$(gh api "repos/$REPO/commits/main" --jq .sha)"
            if [ "$latest" != "$main" ]; then
              main=$latest
              gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/install.sh?ref=$main" >"$expected"
            fi
            status="$(curl --silent --show-error --max-time 20 --dump-header "$headers" --output "$served" --write-out '%{http_code}' "$URL")" || status=000
            [ "$status" != 200 ] || cmp -s "$expected" "$served" || status="200 with other bytes"
            [ "$status" != 200 ] || break
            [ "$attempt" -lt 60 ] || { echo "::error::$URL returned HTTP $status, not 200 with install.sh at $main, after 60 attempts."; exit 1; }
            sleep 10
          done
          type="$(tr -d '\r' <"$headers" | awk 'tolower($1) == "content-type:" { $1 = ""; sub(/^ /, ""); print }' | tail -n 1)"
          media="$(printf '%s' "${type%%;*}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | tr '[:upper:]' '[:lower:]')"
          if [ "$media" != text/plain ]; then
            echo "::error::$URL is served as '$type', not text/plain."
            exit 1
          fi
          echo "$URL matches install.sh at $main ($(wc -c <"$expected") bytes, sha256 $(sha256sum "$expected" | cut -d' ' -f1)) and is served as $type."
          tr -d '\r' <"$headers" | grep -i '^cache-control:' || true
