# SPDX-License-Identifier: Apache-2.0

# Deploys server/ to a real Cloudflare account under a throwaway name, claims it, smoke-tests it over HTTPS, or syncs a
# macOS and a Linux device through it with the koi command, and deletes everything again (docs/deploy-test.md). Manual only: it needs the account's scoped API token, and each run
# uses a little of the account's Workers, Durable Objects and R2 usage. A first job without secrets refuses a run that
# is not on main of koidrive/koidrive, or whose deploy-test environment lacks the protection the docs require; the
# secrets live only in that environment, which releases them after a required reviewer approves the run.

name: Deploy test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke: test HTTPS. upgrade: check earlier data. e2e: sync Linux and macOS. bench: measure Rust chunk uploads."
        type: choice
        options: [smoke, upgrade, e2e, bench]
        default: smoke
      from_ref:
        description: "upgrade only: the commit or tag to upgrade from. Empty means the newest tag before this commit."
        type: string
        required: false
      bench_ns:
        description: "bench only: comma-separated unique concurrency values from 1,2,4,8, at most four."
        type: string
        default: '1,2,4,8'
      bench_repetitions:
        description: "bench only: repetitions per concurrency value, integer 1 through 3. Each measurement uploads 1 GiB."
        type: string
        default: '3'

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  trusted:
    name: deploy test (main and protected environment)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse unless the run is for a commit on main of koidrive/koidrive
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REPOSITORY" != koidrive/koidrive ]; then
            echo "::error::The deploy test runs only in koidrive/koidrive, not in $REPOSITORY."
            exit 1
          fi
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::The deploy test must start from main, not $REF. Choose main under 'Use workflow from'."
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          commit="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::$REF points to $commit, which is not on main. The deploy test runs only commits that were merged to main."
            exit 1
          fi
          echo "$REF ($commit) is on main of $REPOSITORY."
      - name: Refuse unless the deploy-test environment is protected
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          refuse() {
            echo "::error::$1 Set up the deploy-test environment as docs/deploy-test.md describes before running the deploy test."
            exit 1
          }
          environment="$(gh api "repos/$REPOSITORY/environments/deploy-test")" || refuse "The deploy-test environment does not exist or cannot be read."
          reviewers="$(jq -r '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?.reviewer.login] | join(" ")' <<<"$environment")"
          [ "$reviewers" = gunwooterry ] || refuse "The deploy-test environment's required reviewers must be gunwooterry alone, because any one listed reviewer can approve a run (required reviewers: ${reviewers:-none})."
          [ "$(jq -r '.can_admins_bypass' <<<"$environment")" != true ] || refuse "Administrators can bypass the deploy-test environment's protection rules."
          [ "$(jq -r '.deployment_branch_policy.custom_branch_policies // false' <<<"$environment")" = true ] || refuse "The deploy-test environment does not limit deployments to selected branches."
          policies="$(gh api "repos/$REPOSITORY/environments/deploy-test/deployment-branch-policies" --jq '[.branch_policies[] | (.type // "branch") + ":" + .name] | sort | join(",")')" || refuse "The deploy-test environment's branch policies cannot be read."
          [ "$policies" = "branch:main" ] || refuse "The deploy-test environment must allow the main branch only, but allows: ${policies:-nothing}."
          echo "The deploy-test environment lists gunwooterry as its only required reviewer, allows main only, and does not report administrator bypass as allowed. These checks are defence in depth: the boundary is the required reviewer's approval of each run, with administrator bypass turned off by hand as docs/deploy-test.md describes."
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.mode == 'bench'
        with:
          node-version: 24
      - name: Validate benchmark inputs before deployment
        if: inputs.mode == 'bench'
        env:
          KOIDRIVE_BENCH_NS: ${{ inputs.bench_ns }}
          KOIDRIVE_BENCH_REPETITIONS: ${{ inputs.bench_repetitions }}
        run: node server/scripts/deploy-test/bench.ts validate

  deploy-test:
    name: deploy test (${{ inputs.mode }})
    needs: trusted
    runs-on: ubuntu-latest
    environment: deploy-test
    timeout-minutes: ${{ (inputs.mode == 'e2e' || inputs.mode == 'bench') && 90 || 60 }}
    permissions:
      contents: read
      actions: read
    env:
      KOIDRIVE_TEST_NAME: koidrive-test-${{ github.run_id }}-${{ github.run_attempt }}
      WRANGLER_SEND_METRICS: "false"
      KOI: ${{ github.workspace }}/target/debug/koi
      E2E_PEER_JOB: e2e (macOS)
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check the Cloudflare secrets
        id: secrets
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::The deploy test needs the environment secrets$missing in the deploy-test environment. docs/deploy-test.md lists what each holds and the token's permissions. Nothing was deployed."
            exit 1
          fi
          echo "Both secrets are set. This run deploys and then deletes the Worker and R2 bucket $KOIDRIVE_TEST_NAME."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Install the pinned Rust toolchain
        if: inputs.mode == 'e2e' || inputs.mode == 'bench'
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: inputs.mode == 'e2e'
        with:
          key: e2e
      - name: Build koi
        if: inputs.mode == 'e2e'
        working-directory: .
        run: cargo build -p koidrive-cli --locked
      - name: Build the release upload benchmark
        if: inputs.mode == 'bench'
        working-directory: .
        run: cargo test -p koidrive-net --release --locked --test upload_bench --no-run

      - name: Resolve the release to upgrade from
        id: from
        if: inputs.mode == 'upgrade'
        env:
          FROM_REF: ${{ inputs.from_ref }}
        run: node scripts/deploy-test/run.ts upgrade-from "$FROM_REF"

      - name: Deploy ${{ inputs.mode == 'upgrade' && 'the earlier release' || 'this commit' }}
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ inputs.mode == 'upgrade' && steps.from.outputs.sha || github.sha }}
        run: node scripts/deploy-test/run.ts deploy "$REF"

      - name: Claim it with the code from its own log
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-test/run.ts claim

      - name: Smoke test over HTTPS
        if: inputs.mode == 'smoke'
        timeout-minutes: 25
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose smoke
      - name: Benchmark Rust chunk uploads
        if: inputs.mode == 'bench'
        timeout-minutes: 30
        env:
          KOIDRIVE_BENCH_NS: ${{ inputs.bench_ns }}
          KOIDRIVE_BENCH_REPETITIONS: ${{ inputs.bench_repetitions }}
        run: node scripts/deploy-test/bench.ts

      - name: Write data on the earlier release
        if: inputs.mode == 'upgrade'
        timeout-minutes: 5
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose upgrade-write

      - name: Upgrade to this commit
        if: inputs.mode == 'upgrade'
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-test/run.ts deploy "$GITHUB_SHA"

      - name: Check that the data survived the upgrade
        if: inputs.mode == 'upgrade'
        timeout-minutes: 10
        run: pnpm exec vitest run --config scripts/deploy-test/vitest.config.ts --reporter=verbose upgrade-verify

      - name: "e2e: pair the Linux device and seal a pairing code for the macOS device"
        if: inputs.mode == 'e2e'
        timeout-minutes: 50
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-setup
      - name: "e2e: upload the sealed pairing code"
        if: inputs.mode == 'e2e'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos-join-${{ github.run_attempt }}
          path: ${{ runner.temp }}/koidrive-e2e/mac-join/join.bin
          retention-days: 1
          if-no-files-found: error
      - name: "e2e 1: create"
        if: inputs.mode == 'e2e'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-1
      - name: "e2e 2: edit"
        if: inputs.mode == 'e2e'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-test/e2e.ts linux-2 "e2e 1: create"
      - name: "e2e 3: rename and move"
        if: inputs.mode == 'e2e'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-test/e2e.ts linux-3 "e2e 2: edit"
      - name: "e2e 4: delete"
        if: inputs.mode == 'e2e'
        timeout-minutes: 15
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-4
      - name: "e2e 5: Linux goes offline and edits shared.txt"
        if: inputs.mode == 'e2e'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-5-offline
      - name: "e2e 5: Linux comes back and syncs the conflict"
        if: inputs.mode == 'e2e'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-test/e2e.ts linux-5-online "e2e 5: macOS edits shared.txt"
      - name: "e2e 6: a third device reads the space"
        if: inputs.mode == 'e2e'
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-6
      - name: "e2e 7: record the restore point"
        if: inputs.mode == 'e2e'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-test/e2e.ts linux-7-point "e2e 5: macOS holds the conflict's tree"
      - name: "e2e 7: write after the restore point, rewind and recover"
        if: inputs.mode == 'e2e'
        timeout-minutes: 25
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/deploy-test/e2e.ts linux-7
      - name: "e2e: compare the macOS and Linux trees"
        if: inputs.mode == 'e2e'
        timeout-minutes: 20
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/deploy-test/e2e.ts linux-final "e2e: upload the macOS tree"

      - name: Tear down the Worker, its Durable Objects and the R2 bucket
        if: always() && steps.secrets.outcome == 'success'
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/deploy-test/run.ts teardown

  e2e-macos:
    name: e2e (macOS)
    needs: trusted
    if: inputs.mode == 'e2e'
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      KOI: ${{ github.workspace }}/target/debug/koi
      GH_TOKEN: ${{ github.token }}
      E2E_PEER_JOB: deploy test (e2e)
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install the pinned Rust toolchain
        working-directory: .
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
      - name: Build koi
        working-directory: .
        run: cargo build -p koidrive-cli --locked
      - name: "e2e: make the key the pairing code is sealed to"
        run: node scripts/deploy-test/e2e.ts mac-keygen
      - name: "e2e: upload the public key"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos-key-${{ github.run_attempt }}
          path: ${{ runner.temp }}/koidrive-e2e/mac-key/public.pem
          retention-days: 1
          if-no-files-found: error
      - name: "e2e: pair the macOS device"
        timeout-minutes: 60
        run: node scripts/deploy-test/e2e.ts mac-setup
      - name: "e2e 1: create"
        timeout-minutes: 15
        run: node scripts/deploy-test/e2e.ts mac-1
      - name: "e2e 2: edit"
        timeout-minutes: 15
        run: |
          node scripts/deploy-test/e2e.ts mac-2 "e2e 1: create"
      - name: "e2e 3: rename and move"
        timeout-minutes: 15
        run: |
          node scripts/deploy-test/e2e.ts mac-3 "e2e 2: edit"
      - name: "e2e 4: delete"
        timeout-minutes: 15
        run: |
          node scripts/deploy-test/e2e.ts mac-4 "e2e 3: rename and move"
      - name: "e2e 5: macOS edits shared.txt"
        timeout-minutes: 20
        run: |
          node scripts/deploy-test/e2e.ts mac-5 "e2e 5: Linux goes offline and edits shared.txt"
      - name: "e2e 5: macOS holds the conflict's tree"
        timeout-minutes: 20
        run: node scripts/deploy-test/e2e.ts mac-5-check
      - name: "e2e 7: write after the restore point and recover from the rewind"
        timeout-minutes: 40
        run: |
          node scripts/deploy-test/e2e.ts mac-7 "e2e 7: record the restore point"
      - name: "e2e: record the macOS tree"
        timeout-minutes: 20
        run: |
          node scripts/deploy-test/e2e.ts mac-final "e2e 7: write after the restore point, rewind and recover"
      - name: "e2e: upload the macOS tree"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos-listing-${{ github.run_attempt }}
          path: ${{ runner.temp }}/koidrive-e2e/mac-listing/listing.txt
          retention-days: 1
          if-no-files-found: error
