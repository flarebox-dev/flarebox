# SPDX-License-Identifier: Apache-2.0

name: Release journeys

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to verify
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release-journeys.yml
      - .github/workflows/installer.yml
      - scripts/test-release-journeys.py
      - scripts/test-release-journeys-unit.py
  merge_group:

permissions:
  contents: read

concurrency:
  group: release-journeys-${{ inputs.tag || github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Release journey unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check release inputs, evidence, and cleanup boundaries
        run: nice -n 10 python3 scripts/test-release-journeys-unit.py -v

  verify:
    name: Published macOS assets
    needs: checks
    if: inputs.tag != '' || github.event_name == 'release'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify checksums, Gatekeeper assessment, and stapled tickets
        run: nice -n 10 python3 scripts/test-release-journeys.py --tag "$RELEASE_TAG" --scenario verify --evidence "$RUNNER_TEMP/release-journeys/verify"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-journeys-verify
          path: ${{ runner.temp }}/release-journeys/verify
          if-no-files-found: error
          retention-days: 14

  runtime:
    name: macOS release (${{ matrix.scenario }})
    needs: verify
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        scenario: [formula-conflict, cask, installer]
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_ANALYTICS: '1'
      HOMEBREW_NO_ENV_HINTS: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        if: matrix.scenario == 'installer'
        with:
          package_json_file: server/package.json
          dest: ${{ runner.tool_cache }}/setup-pnpm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        if: matrix.scenario == 'installer'
        with:
          node-version: 24
      - name: Prepare the real local Worker
        if: matrix.scenario == 'installer'
        run: |
          nice -n 10 pnpm --dir server install --frozen-lockfile
          nice -n 10 pnpm --dir server build:web
      - name: Exercise the published release in a fresh macOS account
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: nice -n 10 python3 scripts/test-release-journeys.py --tag "$RELEASE_TAG" --scenario "$SCENARIO" --evidence "$RUNNER_TEMP/release-journeys/$SCENARIO"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-journeys-${{ matrix.scenario }}
          path: ${{ runner.temp }}/release-journeys/${{ matrix.scenario }}
          if-no-files-found: error
          retention-days: 14
