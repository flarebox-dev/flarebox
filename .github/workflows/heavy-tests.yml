# SPDX-License-Identifier: Apache-2.0

name: Heavy tests

run-name: Heavy tests of ${{ inputs.crate }}${{ inputs.test && format(' --test {0}', inputs.test) || '' }}${{ inputs.filter && format(' {0}', inputs.filter) || '' }} on ${{ inputs.ref || github.ref_name }} (${{ inputs.os }}, ${{ inputs.repeat || '1' }} runs)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to test (empty tests the ref the run starts from)
        type: string
        default: ''
      crate:
        description: Workspace package to test, such as koidrive-sim
        type: string
        required: true
      test:
        description: Integration test target, as for cargo test --test (empty runs every target of the package)
        type: string
        default: ''
      filter:
        description: Test name filter, as for cargo test (empty runs every test of the selected targets)
        type: string
        default: ''
      cases:
        description: PROPTEST_CASES (empty keeps each property's own case count)
        type: string
        default: ''
      repeat:
        description: Number of times to run the selection on each OS, 1 to 100
        type: string
        default: '1'
      seed:
        description: PROPTEST_RNG_SEED of the first run; run k uses seed + k - 1 (empty derives it from the run ID)
        type: string
        default: ''
      features:
        description: Cargo features, comma-separated, such as koidrive-engine/serde
        type: string
        default: ''
      ignored:
        description: Also run the tests marked #[ignore]
        type: boolean
        default: false
      os:
        description: Operating systems to run on
        type: choice
        options: [both, ubuntu, macos]
        default: both

permissions: {}

env:
  CARGO_TERM_COLOR: always
  CRATE: ${{ inputs.crate }}
  TEST: ${{ inputs.test }}
  FILTER: ${{ inputs.filter }}
  CASES: ${{ inputs.cases }}
  REPEAT: ${{ inputs.repeat || '1' }}
  SEED: ${{ inputs.seed }}
  FEATURES: ${{ inputs.features }}
  IGNORED: ${{ inputs.ignored }}

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      seed: ${{ steps.plan.outputs.seed }}
    steps:
      - name: Check the inputs
        env:
          REF: ${{ inputs.ref }}
        run: |
          errors=()
          [[ "$REF" != -* ]] || errors+=("ref must be a branch, tag or commit, not an option: '$REF'.")
          [[ "$CRATE" =~ ^[A-Za-z0-9_-]+$ ]] || errors+=("crate must be a package name such as koidrive-sim, got '$CRATE'.")
          [[ "$TEST" =~ ^[A-Za-z0-9_-]*$ ]] || errors+=("test must be an integration test target name such as engine_sync, got '$TEST'.")
          [[ "$FILTER" != -* ]] || errors+=("filter must be a test name, not an option: '$FILTER' starts with '-'.")
          [[ "$CASES" =~ ^[0-9]{0,7}$ ]] || errors+=("cases must be empty or a whole number up to 9999999, got '$CASES'.")
          [[ "$REPEAT" =~ ^([1-9][0-9]?|100)$ ]] || errors+=("repeat must be a whole number from 1 to 100, got '$REPEAT'.")
          [[ "$SEED" =~ ^[0-9]{0,15}$ ]] || errors+=("seed must be empty or a whole number of at most 15 digits, got '$SEED'.")
          [[ "$FEATURES" =~ ^[A-Za-z0-9_/,-]*$ ]] || errors+=("features must be comma-separated feature names, got '$FEATURES'.")
          for error in "${errors[@]}"; do echo "::error::$error"; done
          [ "${#errors[@]}" -eq 0 ]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Pin the commit and the seeds
        id: plan
        run: |
          sha=$(git rev-parse HEAD)
          seed=${SEED:-$((GITHUB_RUN_ID * 1000))}
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "seed=$seed" >> "$GITHUB_OUTPUT"
          echo "Commit $sha, $REPEAT runs on each OS, run k uses PROPTEST_RNG_SEED=$seed + k - 1."

  test:
    name: test (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os == 'ubuntu' && '["ubuntu-latest"]' || inputs.os == 'macos' && '["macos-15"]' || '["ubuntu-latest","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 340
    permissions:
      contents: read
    env:
      SHA: ${{ needs.plan.outputs.sha }}
      SEED_BASE: ${{ needs.plan.outputs.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: heavy-tests
      - name: Build the tests
        run: |
          if ! cargo metadata --format-version 1 --locked --no-deps | jq -e --arg crate "$CRATE" 'any(.packages[]; .name == $crate)' > /dev/null; then
            echo "::error::$CRATE is not a package of the workspace at $SHA."
            exit 1
          fi
          cargo test --locked --no-run -p "$CRATE" ${FEATURES:+--features "$FEATURES"} ${TEST:+--test "$TEST"}
      - name: Run the tests
        run: |
          out="$RUNNER_TEMP/heavy-tests"
          mkdir -p "$out/logs" "$out/regressions"
          cargo_args=(--locked --no-fail-fast -p "$CRATE")
          [ -z "$FEATURES" ] || cargo_args+=(--features "$FEATURES")
          [ -z "$TEST" ] || cargo_args+=(--test "$TEST")
          test_args=()
          [ -z "$FILTER" ] || test_args+=("$FILTER")
          [ "$IGNORED" != "true" ] || test_args+=(--include-ignored)
          [ -z "$CASES" ] || export PROPTEST_CASES="$CASES"
          repro_args=$(printf ' %q' "${cargo_args[@]}")
          [ "${#test_args[@]}" -eq 0 ] || repro_args+=" --$(printf ' %q' "${test_args[@]}")"
          repro="git checkout $SHA && PROPTEST_RNG_SEED=<seed>${CASES:+ PROPTEST_CASES=$CASES} cargo test$repro_args"
          {
            echo "### $RUNNER_OS: cargo test$repro_args"
            echo
            echo "Commit $SHA, PROPTEST_CASES=${CASES:-unset, so each property runs its own count}."
            echo
            echo "| Run | Seed | Result | Passed | Failed | Ignored | Minutes |"
            echo "|---|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          green=0 red=0 broken=0 total_passed=0 total_failed=0
          : > "$out/failed-tests.txt"
          for run in $(seq 1 "$REPEAT"); do
            seed=$((SEED_BASE + run - 1))
            log="$out/logs/run-$run.log"
            echo "::group::Run $run of $REPEAT, PROPTEST_RNG_SEED=$seed"
            started=$SECONDS
            set +e
            PROPTEST_RNG_SEED=$seed cargo test "${cargo_args[@]}" -- ${test_args[@]+"${test_args[@]}"} 2>&1 | tee "$log"
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            minutes=$(( (SECONDS - started + 30) / 60 ))
            plain=$(sed -E $'s/\x1b\\[[0-9;]*[A-Za-z]//g' "$log")
            read -r passed failed ignored < <(sed -nE 's/^test result: [A-Za-z]+\. ([0-9]+) passed; ([0-9]+) failed; ([0-9]+) ignored.*/\1 \2 \3/p' <<< "$plain" | awk '{ p += $1; f += $2; i += $3 } END { print p + 0, f + 0, i + 0 }')
            binaries=$(grep -cE '^ *(Running |Doc-tests )' <<< "$plain" || true)
            results=$(grep -cE '^test result: ' <<< "$plain" || true)
            sed -nE 's/^test (.+) \.\.\. FAILED$/\1/p' <<< "$plain" >> "$out/failed-tests.txt"
            total_passed=$((total_passed + passed))
            total_failed=$((total_failed + failed))
            if [ "$code" -eq 0 ] && [ $((passed + failed)) -gt 0 ]; then
              result=pass
              green=$((green + 1))
            elif [ "$code" -eq 0 ]; then
              result="ran no test"
              broken=$((broken + 1))
            elif [ "$failed" -gt 0 ] && [ "$results" -ge "$binaries" ]; then
              result=fail
              red=$((red + 1))
            else
              result="error: exit $code, $results of $binaries test binaries finished"
              broken=$((broken + 1))
            fi
            echo "| $run | $seed | $result | $passed | $failed | $ignored | $minutes |" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" != pass ]; then
              echo "::error title=Run $run: $result::Reproduce: ${repro/<seed>/$seed}"
            fi
          done
          {
            echo
            echo "**$green of $REPEAT runs passed, $red failed, $broken did not finish cleanly.** $total_passed tests passed and $total_failed failed across all runs."
            if [ -s "$out/failed-tests.txt" ]; then
              echo
              echo "| Failed test | Runs it failed in |"
              echo "|---|---|"
              sort "$out/failed-tests.txt" | uniq -c | sort -rn | while read -r count name; do printf '| <code>%s</code> | %s |\n' "$name" "$count"; done
            fi
            if [ $((red + broken)) -gt 0 ]; then
              echo
              echo "Reproduce a run with its seed from the table:"
              echo
              echo '```sh'
              echo "$repro"
              echo '```'
              echo
              echo "The heavy-tests-$RUNNER_OS artifact holds each run's log and any new proptest case files."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain --untracked-files=all -- '*.proptest-regressions' '*/proptest-regressions/*.txt' '*.cases/*.txt' | cut -c4- | while read -r file; do
            mkdir -p "$out/regressions/$(dirname "$file")"
            cp "$file" "$out/regressions/$file"
          done
          [ $((red + broken)) -eq 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: heavy-tests-${{ runner.os }}
          path: ${{ runner.temp }}/heavy-tests
          retention-days: 7
          if-no-files-found: ignore
