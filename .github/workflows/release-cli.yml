# SPDX-License-Identifier: Apache-2.0
name: CLI distribution

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-alpha.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: CLI targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
      macos: ${{ steps.targets.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Decide which targets the change needs
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          LINUX: '[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-latest"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-latest"}]'
          MACOS: '[{"target":"aarch64-apple-darwin","runner":"macos-15"},{"target":"x86_64-apple-darwin","runner":"macos-15-intel"}]'
        run: |
          linux=true
          macos=true
          if [ "$EVENT" = pull_request ]; then
            BASE=$(git rev-parse HEAD^1)
            if ! git diff -z --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"; then
              echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
              exit 1
            fi
            changed="$(tr '\0' '\n' < "$RUNNER_TEMP/changed")"
            echo "Files this pull request changes against $BASE:"
            printf '%s\n' "$changed"
            pattern='^(cli/|core/|server/|\.cargo/|install\.sh$|scripts/test-install\.sh$|scripts/(test-)?publish-release\.sh$|\.github/workflows/release-cli\.yml$|Cargo\.[^/]*$|rust-toolchain\.toml$)'
            if grep -Eq "$pattern" <<<"$changed"; then
              echo "Linux targets: build, because a changed file matches $pattern"
            else
              echo "Linux targets: skipped, because no changed file matches $pattern. The merge queue run of this workflow builds them."
              linux=false
            fi
            bash scripts/test-macos-changes.sh
            if ! platform="$(scripts/macos-changes.sh "$BASE" HEAD)"; then
              echo "::error::Listing the macOS-specific files between $BASE and HEAD failed (see the error above)."
              exit 1
            fi
            pattern='^(install\.sh$|scripts/test-install\.sh$|scripts/(test-)?publish-release\.sh$|scripts/(test-)?macos-changes\.sh$|\.github/workflows/release-cli\.yml$)'
            reasons="$(cut -f1 <<<"$platform" | grep -Ev '^(apps/macos|core/ffi)/' || true)"$'\n'"$(grep -E "$pattern" <<<"$changed" || true)"
            if [ -n "$(tr -d '[:space:]' <<<"$reasons")" ]; then
              echo "macOS targets: build, because of $(tr '\n' ' ' <<<"$reasons")"
            else
              echo "macOS targets: skipped, because no file changed that builds or behaves differently on macOS. The merge queue run of this workflow builds them."
              macos=false
            fi
          else
            echo "$EVENT run: every target builds."
          fi
          targets="$(jq -cn --argjson linux "$LINUX" --argjson macos "$MACOS" --argjson build_linux "$linux" --argjson build_macos "$macos" '(if $build_linux then $linux else [] end) + (if $build_macos then $macos else [] end)')"
          echo "Targets: $targets"
          {
            echo "targets=$targets"
            echo "count=$(jq length <<<"$targets")"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"

  release-ref:
    name: CLI release commit on main
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prerelease: ${{ steps.ref.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a release outside main
        id: ref
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$ ]] || { echo '::error::Expected a vMAJOR.MINOR.PATCH tag, optionally with an -alpha.N or -rc.N suffix'; exit 1; }
            if [[ "$TAG" == *-* ]]; then prerelease=true; else prerelease=false; fi
            echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release tags must point to a commit on main'; exit 1; }

  build:
    name: CLI (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Pack the server bundle
        run: |
          pnpm --dir server install --frozen-lockfile
          node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
          echo "KOIDRIVE_SERVER_BUNDLE=$RUNNER_TEMP/server-bundle" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}
      - name: Install Linux cross-build tools and ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck qemu-user
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install cargo-zigbuild==0.24.1 ziglang==0.15.2
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Lint the installer and the release scripts
        run: |
          shellcheck -s sh install.sh scripts/test-install.sh
          shellcheck scripts/publish-release.sh scripts/test-publish-release.sh
      - name: Test publishing a release against a stub gh
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: bash scripts/test-publish-release.sh
      - name: Build the CLI with its server bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *linux-musl ]]; then
            nice -n 10 cargo zigbuild --release --locked -p koidrive-cli --target "$TARGET"
            file "target/$TARGET/release/koi"
            if readelf -l "target/$TARGET/release/koi" | grep -q INTERP || readelf -d "target/$TARGET/release/koi" | grep -q NEEDED; then
              echo '::error::The Linux release binary needs a dynamic interpreter or library; expected a static musl binary.'
              exit 1
            fi
          else
            nice -n 10 cargo build --release --locked -p koidrive-cli --target "$TARGET"
          fi
          embedded=$(find "target/$TARGET/release/build" -path '*/out/server_bundle.rs' -exec grep -l include_bytes {} +)
          test -n "$embedded" || { echo '::error::The CLI has no embedded server bundle'; exit 1; }
      - name: Check the version the CLI reports
        env:
          TARGET: ${{ matrix.target }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = push ]; then
            expected=${TAG#v}
            from="the tag $TAG"
          else
            expected=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "koidrive-cli") | .version')
            from="Cargo.toml"
          fi
          binary="target/$TARGET/release/koi"
          if [ "$TARGET" = aarch64-unknown-linux-musl ]; then
            actual=$(qemu-aarch64 "$binary" --version)
          else
            actual=$("$binary" --version)
          fi
          if [ "$actual" != "koi $expected" ]; then
            echo "::error::koi --version prints '$actual', but $from needs 'koi $expected'. Set version in [workspace.package] of Cargo.toml to $expected and tag again."
            exit 1
          fi
          echo "koi --version prints '$actual', matching $from."
      - name: Test the installer against a local tarball
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/test-install.sh "target/$TARGET/release/koi" "$TARGET"
      - name: Package the CLI
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/koi" package/koi
          tar -czf "dist/koidrive-$TARGET.tar.gz" -C package koi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sign-macos:
    name: Sign and notarize the macOS CLI
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs: [build, release-ref]
    runs-on: macos-15
    timeout-minutes: 150
    environment: macos-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: Sign and notarize with the Developer ID
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          NOTARY_DEADLINE_SECONDS: 3600
          DEVELOPER_ID_G2_SHA256: f16cd3c54c7f83cea4bf1a3e6a0819c8aaa8e4a1528fd144715f350643d2df3a
        run: |
          missing=
          [ -n "$P12_BASE64" ] || missing="$missing MACOS_DEVELOPER_ID_P12_BASE64"
          [ -n "$P12_PASSWORD" ] || missing="$missing MACOS_DEVELOPER_ID_P12_PASSWORD"
          [ -n "$KEY_P8_BASE64" ] || missing="$missing APP_STORE_CONNECT_API_KEY_P8_BASE64"
          [ -n "$NOTARY_KEY_ID" ] || missing="$missing APP_STORE_CONNECT_API_KEY_ID"
          [ -n "$NOTARY_ISSUER_ID" ] || missing="$missing APP_STORE_CONNECT_API_ISSUER_ID"
          if [ -n "$missing" ]; then
            echo "::error::Signing and notarizing the macOS CLI needs these secrets in the macos-release environment:$missing"
            exit 1
          fi
          umask 077
          secrets_dir="$RUNNER_TEMP/cli-signing"
          keychain="$secrets_dir/signing.keychain-db"
          mkdir -p "$secrets_dir"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 9000 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          curl -fsSL --retry 3 -o "$secrets_dir/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          echo "$DEVELOPER_ID_G2_SHA256  $secrets_dir/DeveloperIDG2CA.cer" | shasum -a 256 -c - || { echo "::error::Apple's Developer ID G2 intermediate certificate does not have the pinned SHA-256."; exit 1; }
          security import "$secrets_dir/DeveloperIDG2CA.cer" -k "$keychain" >/dev/null
          printf '%s' "$P12_BASE64" | base64 --decode > "$secrets_dir/developer-id.p12"
          printf '%s' "$KEY_P8_BASE64" | base64 --decode > "$secrets_dir/notary-key.p8"
          security import "$secrets_dir/developer-id.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$secrets_dir/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          search_list=()
          while IFS= read -r entry; do
            entry="${entry#"${entry%%[![:space:]]*}"}"
            search_list+=("${entry//\"/}")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$keychain" "${search_list[@]}"
          identities=$(security find-identity -v -p codesigning "$keychain" | grep '"Developer ID Application: ' || true)
          count=$(grep -c . <<< "$identities" || true)
          [ "$count" = 1 ] || { echo "::error::Expected one valid Developer ID Application identity, found $count."; exit 1; }
          echo "Signing identity: $(sed -E 's/^ *[0-9]+\) [0-9A-F]+ //' <<< "$identities")"
          identity=$(awk '{print $2}' <<< "$identities")
          for archive in dist/*.tar.gz; do
            name=$(basename "$archive" .tar.gz)
            package="$RUNNER_TEMP/$name"
            mkdir "$package"
            tar -xzf "$archive" -C "$package"
            codesign --force --keychain "$keychain" --sign "$identity" --options runtime --timestamp "$package/koi"
            codesign --verify --strict --verbose=2 "$package/koi"
            ditto -c -k "$package/koi" "$package.zip"
            NOTARY_KEY_PATH="$secrets_dir/notary-key.p8" apps/macos/scripts/notarize.sh "$package.zip"
            tar -czf "$archive" -C "$package" koi
            echo "Signed and notarized koi in $archive."
          done
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cli-signing/signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/cli-signing"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-macos-release
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: CLI checksums
    needs: [changes, build, sign-macos]
    if: always() && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || (github.event_name != 'push' && needs.sign-macos.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*-linux-musl
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign-macos.result == 'success'
        with:
          name: cli-macos-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign-macos.result == 'skipped' && needs.changes.outputs.macos == 'true'
        with:
          pattern: cli-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: Write and verify SHA256SUMS
        env:
          COUNT: ${{ needs.changes.outputs.count }}
        run: |
          cd dist
          found="$(find . -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$found" != "$COUNT" ]; then
            echo "::error::Expected $COUNT CLI tarballs, one per built target, but found $found."
            exit 1
          fi
          sha256sum koidrive-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-distribution
          path: dist/*
          if-no-files-found: error

  cli-report:
    name: cli-report
    if: always()
    needs: [changes, build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every CLI target the change needs built and was checksummed
        env:
          CHANGES: ${{ needs.changes.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          BUILD: ${{ needs.build.result }}
          CHECKSUMS: ${{ needs.checksums.result }}
        run: |
          echo "CLI targets: $CHANGES (${COUNT:-unknown} targets), build: $BUILD, checksums: $CHECKSUMS"
          if [ "$CHANGES" != success ]; then
            echo "::error::The CLI targets job is $CHANGES, so which targets this change needs is unknown. Open that job's log for the cause."
            exit 1
          fi
          if [ "$COUNT" = 0 ]; then
            echo "This change touches no file the CLI targets use, so build and checksums are skipped by design."
            exit 0
          fi
          if [ "$BUILD" != success ] || [ "$CHECKSUMS" != success ]; then
            echo "::error::$COUNT CLI targets had to build, but build is $BUILD and checksums is $CHECKSUMS. Open the failed job's log for the cause."
            exit 1
          fi
          echo "All $COUNT CLI targets built and their checksums verified."

  publish:
    name: Publish CLI tarballs
    needs: [release-ref, checksums]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-cli-publish
      cancel-in-progress: false
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-distribution
          path: dist
      - name: Attach tarballs and checksums to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.release-ref.outputs.prerelease }}
          # latest: an -alpha.N or -rc.N tag becomes a normal release, and Latest (which install.sh downloads by default) unless a published release has a higher version.
          # prerelease: it becomes a GitHub prerelease, which install.sh skips unless KOIDRIVE_VERSION names it.
          PRERELEASE_TAGS_PUBLISH_AS: latest
        run: scripts/publish-release.sh "$TAG" dist
