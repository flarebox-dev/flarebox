# SPDX-License-Identifier: Apache-2.0
name: CLI distribution

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: CLI targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
      count: ${{ steps.targets.outputs.count }}
      macos: ${{ steps.targets.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide which targets the change needs
        id: targets
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          LINUX: '[{"target":"x86_64-unknown-linux-musl","runner":"ubuntu-latest"},{"target":"aarch64-unknown-linux-musl","runner":"ubuntu-latest"}]'
          MACOS: '[{"target":"aarch64-apple-darwin","runner":"macos-15"},{"target":"x86_64-apple-darwin","runner":"macos-15-intel"}]'
        run: |
          linux=true
          macos=true
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags --depth=1 origin "$BASE"
            if ! git diff -z --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"; then
              echo "::error::git diff between $BASE and HEAD failed, so the changed paths are unknown."
              exit 1
            fi
            changed="$(tr '\0' '\n' < "$RUNNER_TEMP/changed")"
            echo "Files this pull request changes against $BASE:"
            printf '%s\n' "$changed"
            pattern='^(cli/|core/|server/|\.cargo/|install\.sh$|scripts/test-install\.sh$|\.github/workflows/release-cli\.yml$|Cargo\.[^/]*$|rust-toolchain\.toml$)'
            if grep -Eq "$pattern" <<<"$changed"; then
              echo "Linux targets: build, because a changed file matches $pattern"
            else
              echo "Linux targets: skipped, because no changed file matches $pattern. The merge queue run of this workflow builds them."
              linux=false
            fi
            pattern='^(cli/|\.cargo/|install\.sh$|scripts/test-install\.sh$|\.github/workflows/release-cli\.yml$|Cargo\.(toml|lock)$|rust-toolchain\.toml$)'
            if grep -Eq "$pattern" <<<"$changed"; then
              echo "macOS targets: build, because a changed file matches $pattern"
            else
              echo "macOS targets: skipped, because no changed file matches $pattern. The merge queue run of this workflow builds them."
              macos=false
            fi
          else
            echo "$EVENT run: every target builds."
          fi
          targets="$(jq -cn --argjson linux "$LINUX" --argjson macos "$MACOS" --argjson build_linux "$linux" --argjson build_macos "$macos" '(if $build_linux then $linux else [] end) + (if $build_macos then $macos else [] end)')"
          echo "Targets: $targets"
          {
            echo "targets=$targets"
            echo "count=$(jq length <<<"$targets")"
            echo "macos=$macos"
          } >> "$GITHUB_OUTPUT"

  release-ref:
    name: CLI release tag on main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Refuse a release tag outside main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '::error::Expected a vMAJOR.MINOR.PATCH tag'; exit 1; }
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main || { echo '::error::Release tags must point to a commit on main'; exit 1; }

  build:
    name: CLI (${{ matrix.target }})
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: server/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml
      - name: Pack the server bundle
        run: |
          pnpm --dir server install --frozen-lockfile
          node server/scripts/pack-bundle.mjs "$RUNNER_TEMP/server-bundle"
          echo "KOIDRIVE_SERVER_BUNDLE=$RUNNER_TEMP/server-bundle" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain and target
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: cli-${{ matrix.target }}
      - name: Install Linux cross-build tools and ShellCheck
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          python3 -m venv "$RUNNER_TEMP/zigbuild"
          "$RUNNER_TEMP/zigbuild/bin/pip" install cargo-zigbuild==0.24.1 ziglang==0.15.2
          echo "$RUNNER_TEMP/zigbuild/bin" >> "$GITHUB_PATH"
      - name: Install ShellCheck on macOS
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Lint the installer
        run: shellcheck -s sh install.sh scripts/test-install.sh
      - name: Build the CLI with its server bundle
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *linux-musl ]]; then
            nice -n 10 cargo zigbuild --release --locked -p koidrive-cli --target "$TARGET"
            file "target/$TARGET/release/koi"
            if readelf -l "target/$TARGET/release/koi" | grep -q INTERP || readelf -d "target/$TARGET/release/koi" | grep -q NEEDED; then
              echo '::error::The Linux release binary needs a dynamic interpreter or library; expected a static musl binary.'
              exit 1
            fi
          else
            nice -n 10 cargo build --release --locked -p koidrive-cli --target "$TARGET"
          fi
          embedded=$(find "target/$TARGET/release/build" -path '*/out/server_bundle.rs' -exec grep -l include_bytes {} +)
          test -n "$embedded" || { echo '::error::The CLI has no embedded server bundle'; exit 1; }
      - name: Test the installer against a local tarball
        if: matrix.target != 'aarch64-unknown-linux-musl'
        env:
          TARGET: ${{ matrix.target }}
        run: sh scripts/test-install.sh "target/$TARGET/release/koi" "$TARGET"
      - name: Package the CLI and user unit
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist package
          cp "target/$TARGET/release/koi" package/koi
          cp cli/systemd/koidrive.service package/koidrive.service
          tar -czf "dist/koidrive-$TARGET.tar.gz" -C package koi koidrive.service
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  sign-macos:
    name: Sign the macOS CLI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, release-ref]
    runs-on: macos-15
    timeout-minutes: 15
    environment: macos-release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: Sign with the existing Developer ID identity
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          if [ -z "$P12_BASE64" ] && [ -z "$P12_PASSWORD" ]; then
            echo '::warning::No Developer ID secrets configured. macOS CLI tarballs are unsigned and not notarized.'
            exit 0
          fi
          if [ -z "$P12_BASE64" ] || [ -z "$P12_PASSWORD" ]; then
            echo '::error::Set both MACOS_DEVELOPER_ID_P12_BASE64 and MACOS_DEVELOPER_ID_P12_PASSWORD, or neither.'
            exit 1
          fi
          umask 077
          keychain="$RUNNER_TEMP/cli-signing.keychain-db"
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1800 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cli-signing.p12"
          security import "$RUNNER_TEMP/cli-signing.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cli-signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" >/dev/null
          identities=$(security find-identity -v -p codesigning "$keychain" | grep '"Developer ID Application: ')
          test "$(printf '%s\n' "$identities" | wc -l | tr -d ' ')" = 1 || { echo '::error::Expected exactly one Developer ID Application identity'; exit 1; }
          identity=$(awk '{print $2}' <<< "$identities")
          for archive in dist/*.tar.gz; do
            mkdir package
            tar -xzf "$archive" -C package
            codesign --force --keychain "$keychain" --sign "$identity" --options runtime --timestamp package/koi
            codesign --verify --strict --verbose=2 package/koi
            tar -czf "$archive" -C package koi koidrive.service
            rm -rf package
          done
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/cli-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cli-signing.p12"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-macos-release
          path: dist/*.tar.gz
          if-no-files-found: error

  checksums:
    name: CLI checksums
    needs: [changes, build, sign-macos]
    if: always() && needs.build.result == 'success' && (needs.sign-macos.result == 'success' || (github.event_name != 'push' && needs.sign-macos.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cli-*-linux-musl
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign-macos.result == 'success'
        with:
          name: cli-macos-release
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.sign-macos.result == 'skipped' && needs.changes.outputs.macos == 'true'
        with:
          pattern: cli-*-apple-darwin
          merge-multiple: true
          path: dist
      - name: Write and verify SHA256SUMS
        env:
          COUNT: ${{ needs.changes.outputs.count }}
        run: |
          cd dist
          found="$(find . -name '*.tar.gz' | wc -l | tr -d ' ')"
          if [ "$found" != "$COUNT" ]; then
            echo "::error::Expected $COUNT CLI tarballs, one per built target, but found $found."
            exit 1
          fi
          sha256sum koidrive-*.tar.gz > SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-distribution
          path: dist/*
          if-no-files-found: error

  cli-report:
    name: cli-report
    if: always()
    needs: [changes, build, checksums]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every CLI target the change needs built and was checksummed
        env:
          CHANGES: ${{ needs.changes.result }}
          COUNT: ${{ needs.changes.outputs.count }}
          BUILD: ${{ needs.build.result }}
          CHECKSUMS: ${{ needs.checksums.result }}
        run: |
          echo "CLI targets: $CHANGES (${COUNT:-unknown} targets), build: $BUILD, checksums: $CHECKSUMS"
          if [ "$CHANGES" != success ]; then
            echo "::error::The CLI targets job is $CHANGES, so which targets this change needs is unknown. Open that job's log for the cause."
            exit 1
          fi
          if [ "$COUNT" = 0 ]; then
            echo "This change touches no file the CLI targets use, so build and checksums are skipped by design."
            exit 0
          fi
          if [ "$BUILD" != success ] || [ "$CHECKSUMS" != success ]; then
            echo "::error::$COUNT CLI targets had to build, but build is $BUILD and checksums is $CHECKSUMS. Open the failed job's log for the cause."
            exit 1
          fi
          echo "All $COUNT CLI targets built and their checksums verified."

  publish:
    name: Publish CLI tarballs
    needs: checksums
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-distribution
          path: dist
      - name: Attach tarballs and checksums to the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes 'Koidrive CLI for Linux and macOS. See docs/guide/install.md for installation.'
          fi
          gh release upload "$TAG" dist/* --clobber
          gh release edit "$TAG" --draft=false
