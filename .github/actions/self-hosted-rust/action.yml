# SPDX-License-Identifier: Apache-2.0
name: Self-hosted Rust
description: Use Homebrew's rustup with rustup and Cargo homes and a target directory private to this self-hosted runner, and keep the target directory under a size cap.
inputs:
  target-cap-gib:
    description: Size in GiB above which the job's target directory is removed before the build.
    default: "15"
  idle-days:
    description: Days after which a target directory that no job has used is removed.
    default: "14"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB: ${{ github.job }}
        CAP_GIB: ${{ inputs.target-cap-gib }}
        IDLE_DAYS: ${{ inputs.idle-days }}
      run: |
        printf 'RUSTUP_HOME=%s\nCARGO_HOME=%s\n' "$RUNNER_TOOL_CACHE/rustup" "$RUNNER_TOOL_CACHE/cargo" >> "$GITHUB_ENV"
        echo "Runner $RUNNER_NAME uses RUSTUP_HOME=$RUNNER_TOOL_CACHE/rustup and CARGO_HOME=$RUNNER_TOOL_CACHE/cargo."
        proxies=/opt/homebrew/opt/rustup/bin
        if [ ! -x "$proxies/cargo" ] || [ ! -x "$proxies/rustc" ]; then
          echo "::error::Runner $RUNNER_NAME has no cargo or rustc in $proxies. Install rustup with Homebrew (brew install rustup) on the Mac that hosts the runners."
          exit 1
        fi
        echo "$proxies" >> "$GITHUB_PATH"
        echo "Runner $RUNNER_NAME takes cargo and rustc from $proxies."

        targets="$RUNNER_TOOL_CACHE/cargo-target"
        target="$targets/$JOB"
        mkdir -p "$targets"
        find "$targets" -mindepth 2 -maxdepth 2 -name .last-used -mtime "+$IDLE_DAYS" -print | while read -r stamp; do
          echo "Removing $(dirname "$stamp"), which no job has used for more than $IDLE_DAYS days."
          rm -rf "$(dirname "$stamp")"
        done
        if [ -d "$target" ]; then
          size_kib="$(du -sk "$target" | cut -f1)"
          if [ "$size_kib" -gt "$((CAP_GIB * 1048576))" ]; then
            echo "Removing $target: it holds $((size_kib / 1048576)) GiB, over the $CAP_GIB GiB cap, so this job builds from scratch."
            rm -rf "$target"
          else
            echo "Reusing $target ($((size_kib / 1048576)) GiB of the $CAP_GIB GiB cap)."
          fi
        fi
        mkdir -p "$target"
        touch "$target/.last-used"
        echo "CARGO_TARGET_DIR=$target" >> "$GITHUB_ENV"
