syntax = "proto3";

package flarebox.v1;

import "flarebox/v1/model.proto";

// An intended change sent by a client.
message Op {
  oneof op {
    CreateDir create_dir = 1;
    CreateFile create_file = 2;
    UpdateContent update_content = 3;
    Move move = 4;
    Delete delete = 5;
    Restore restore = 6;
  }
}

message CreateDir {
  string node_id = 1;
  string parent_id = 2;
  string name = 3;
}

message CreateFile {
  string node_id = 1;
  string parent_id = 2;
  string name = 3;
  Content content = 4;
}

message UpdateContent {
  string node_id = 1;
  Content content = 2;
}

message Move {
  string node_id = 1;
  string new_parent_id = 2;
  string new_name = 3;
}

message Delete {
  string node_id = 1;
}

message Restore {
  string node_id = 1;
  string version_id = 2;
  string target_parent_id = 3;
  string name = 4;
}

message UploadReceipt {
  bytes hash = 1;
  uint32 size = 2;
  string token = 3;
}

message Commit {
  string commit_id = 1;
  uint64 base_seq = 2;
  repeated Op ops = 3;
  repeated UploadReceipt receipts = 4;
}

message OpResult {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_APPLIED = 1;
    CODE_APPLIED_RENAMED = 2;
    CODE_CONFLICT_COPY = 3;
    CODE_MERGED_INTO = 4;
    CODE_SUPERSEDED = 5;
    CODE_REJECTED = 6;
  }
  Code code = 1;
  // ID of the conflict copy or of the directory merged into.
  string node_id = 2;
  // The name actually used.
  string name = 3;
  string reject_reason = 4;
}

message CommitResult {
  uint64 seq = 1;
  repeated OpResult results = 2;
  repeated ChangeRecord changes = 3;
}
