syntax = "proto3";

package flarebox.v1;

// Bodies of the HTTP endpoints in spec v0 section 15.

// GET /v1/server
message ServerInfo {
  enum DataPath {
    DATA_PATH_UNSPECIFIED = 0;
    // Chunks go through the Worker.
    DATA_PATH_RELAY = 1;
    // Chunks go to R2 with presigned URLs.
    DATA_PATH_DIRECT = 2;
  }
  string server_version = 1;
  uint32 proto_min = 2;
  uint32 proto_max = 3;
  DataPath data_path = 4;
  // True once an owner has claimed this deployment.
  bool claimed = 5;
}

// POST /v1/claim
message ClaimRequest {
  // The one-time claim code from the Worker log.
  string code = 1;
  string user_name = 2;
  string device_name = 3;
  string platform = 4;
}

// Response of POST /v1/pair/start, called by an already paired device.
message PairStartResponse {
  string code = 1;
  int64 expires_at_ms = 2;
}

// POST /v1/pair/complete, called by the new device.
message PairCompleteRequest {
  string code = 1;
  string device_name = 2;
  string platform = 3;
}

// Response of POST /v1/claim and POST /v1/pair/complete.
message DeviceCredentials {
  string user_id = 1;
  string device_id = 2;
  // Long-lived secret exchanged for access tokens. The server keeps only its SHA-256.
  string refresh_credential = 3;
  AccessToken access = 4;
  // When the refresh credential stops working, in Unix milliseconds; 0 if it never expires (RFC 0006 section 7).
  int64 credential_expires_at_ms = 5;
}

// POST /v1/token
message TokenRequest {
  string device_id = 1;
  string refresh_credential = 2;
}

message AccessToken {
  // Opaque to clients.
  string token = 1;
  int64 expires_at_ms = 2;
}

message SpaceInfo {
  string space_id = 1;
  string name = 2;
  uint32 format_version = 3;
  int64 created_at_ms = 4;
}

// POST /v1/spaces
message CreateSpaceRequest {
  string name = 1;
}

// Response of GET /v1/spaces.
message SpaceList {
  repeated SpaceInfo spaces = 1;
}

// One principal of the caller's user, as GET /v1/devices lists it (RFC 0006 section 7).
message DeviceInfo {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    // A person's computer.
    KIND_DEVICE = 1;
    // An automated client; not issued in 0.1.0.
    KIND_AGENT = 2;
  }
  // The principal ID (RFC 0006 section 4).
  string device_id = 1;
  string name = 2;
  string platform = 3;
  Kind kind = 4;
  int64 created_at_ms = 5;
  // 0 if the principal has never refreshed an access token.
  int64 last_seen_ms = 6;
  // 0 if not revoked.
  int64 revoked_at_ms = 7;
  // 0 if the refresh credential never expires.
  int64 credential_expires_at_ms = 8;
  // The principal whose request created this one; empty for the device created by claim or owner recovery.
  string issued_by = 9;
  // True for the principal that made the request.
  bool current = 10;
}

// Response of GET /v1/devices.
message DeviceList {
  repeated DeviceInfo devices = 1;
  // Empty on the last page; otherwise pass it back as ?cursor=.
  string next_cursor = 2;
}

// POST /v1/spaces/{space_id}/rewind, owner only (RFC 0003).
message RewindRequest {
  // The point in time to restore, in Unix milliseconds.
  int64 restore_point_ms = 1;
  // The history the caller expects the space to be in; the rewind is refused with CODE_HISTORY_MISMATCH otherwise.
  string expected_history_id = 2;
  // A UUIDv7 chosen once per intended rewind and reused on every retry; a retry returns that rewind's result or state.
  string rewind_id = 3;
}

// Response of POST /v1/spaces/{space_id}/rewind.
message RewindResult {
  // The history that began with this rewind.
  string history_id = 1;
  // head_seq right after the rewind.
  uint64 restore_seq = 2;
  // The point in time that was restored, as requested.
  int64 restore_point_ms = 3;
  string previous_history_id = 4;
  // head_seq of previous_history_id right before the rewind. It counts in that history, while restore_seq counts in the
  // history the restore point belonged to, which can be an earlier one, so the two do not bound the discarded commits.
  uint64 previous_head_seq = 5;
}
