# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-cli"
description = "Koidrive command-line client and sync daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "koi"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
koidrive-cloudflare = { path = "../core/cloudflare" }
koidrive-driver = { path = "../core/driver" }
koidrive-engine = { path = "../core/engine" }
koidrive-net = { path = "../core/net" }
koidrive-proto = { path = "../core/proto" }
koidrive-telemetry = { path = "../core/telemetry" }
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "net", "process", "stdio", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2.5.8"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "6.2.1", default-features = false, features = ["tokio"] }

[build-dependencies]
serde_json = "1.0.154"

[dev-dependencies]
bytes = "1.12.1"
fastrand = "2"
koidrive-chunk = { path = "../core/chunk" }
koidrive-store = { path = "../core/store" }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false }
tokio = { version = "1.48", features = ["full"] }
url = "2.5.8"
