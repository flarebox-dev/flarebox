# SPDX-License-Identifier: Apache-2.0

[package]
name = "flarebox-cli"
description = "Flarebox command-line client and sync daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "flarebox"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
flarebox-driver = { path = "../core/driver" }
rustix = { version = "1.1.6", features = ["process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
fastrand = "2"
flarebox-net = { path = "../core/net" }
flarebox-proto = { path = "../core/proto" }
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full"] }
url = "2.5.8"
