<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koidrive, your own Dropbox on Cloudflare</title>
<meta name="description" content="Koidrive is an open-source file sync service whose server, metadata and file chunks live in a Cloudflare account you own.">
<meta property="og:type" content="website">
<meta property="og:title" content="Koidrive, your own Dropbox on Cloudflare">
<meta property="og:description" content="Koidrive is an open-source file sync service whose server, metadata and file chunks live in a Cloudflare account you own.">
<meta property="og:image" content="og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Koidrive koi icon and wordmark">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Koidrive, your own Dropbox on Cloudflare">
<meta name="twitter:description" content="Koidrive is an open-source file sync service whose server, metadata and file chunks live in a Cloudflare account you own.">
<meta name="twitter:image" content="og.png">
<meta name="theme-color" content="#030201">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="preload" href="fonts/outfit-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/onest-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<header>
  <nav class="container nav" aria-label="Main">
    <a class="brand" href="/" aria-label="Koidrive home"><img class="brand-icon" src="logo/nav-icon.svg" alt="" width="24" height="28"><img class="wordmark" src="logo/wordmark.svg" alt="" width="118" height="24"></a>
    <ul class="links">
      <li><a class="link" href="https://github.com/flarebox-dev/flarebox">GitHub</a></li>
    </ul>
  </nav>
</header>

<main id="main">
  <section class="hero" aria-labelledby="hero-title">
    <div class="container ledge bare">
      <div class="head">
        <div class="claim">
          <h1 id="hero-title">Your own Dropbox on Cloudflare<span class="reg">®</span></h1>
          <div class="cta">
            <a class="btn btn--primary" href="https://github.com/flarebox-dev/flarebox">See GitHub</a>
          </div>
        </div>
        <div class="act">
          <div class="term">
            <code class="cmds" data-cmds><span class="line"><span class="prompt" aria-hidden="true">$ </span><span data-cmd>brew install <span class="arg">flarebox-dev/tap/flarebox</span></span></span><span class="line"><span class="prompt" aria-hidden="true">$ </span><span data-cmd>flarebox setup</span></span></code>
            <button class="copy" type="button" aria-live="polite">Copy</button>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer class="container foot">
  <div class="inner">
    <p class="notice">Cloudflare is a trademark of Cloudflare, Inc. Dropbox is a trademark of Dropbox, Inc. Koidrive is not affiliated with or endorsed by either company.</p>
  </div>
</footer>

<script>
const copy = document.querySelector('.copy');
const cmds = document.querySelector('[data-cmds]');
const text = [...cmds.querySelectorAll('[data-cmd]')].map((c) => c.textContent).join('\n');
const idle = 'Copy both commands';
const show = (label, name) => {
  copy.textContent = label;
  copy.setAttribute('aria-label', name);
  setTimeout(() => { copy.textContent = 'Copy'; copy.setAttribute('aria-label', idle); }, 2400);
};
const fail = () => {
  getSelection().selectAllChildren(cmds);
  show('Copy failed', 'Could not copy. Both commands are selected, so copy them with your keyboard.');
};
copy.setAttribute('aria-label', idle);
copy.addEventListener('click', () => {
  if (!navigator.clipboard) return fail();
  navigator.clipboard.writeText(text).then(() => show('Copied', 'Copied both commands'), fail);
});
</script>
</body>
</html>
