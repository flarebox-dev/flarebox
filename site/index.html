<!doctype html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flarebox, your own Dropbox on Cloudflare</title>
<meta name="description" content="Flarebox is an open-source file sync service whose server, metadata and file chunks live in a Cloudflare account you own.">
<link rel="stylesheet" href="site.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="site-nav">
  <div class="container">
    <nav class="site-nav__bar cut" aria-label="Main">
      <a class="wordmark" href="#top" aria-label="Flarebox, back to the top">Flarebox</a>
      <a class="key key--primary key--small" href="https://github.com/flarebox-dev/flarebox">See GitHub</a>
    </nav>
  </div>
</header>

<main id="main">
  <section class="hero" id="top" aria-labelledby="hero-title">
    <div class="container hero__grid">
      <div class="hero__text">
        <h1 id="hero-title">Your own Dropbox on Cloudflare</h1>
        <p class="lead">The open-source server, its database and your files stay in your account.</p>
      </div>

      <figure class="term cut" aria-label="Installing Flarebox and running setup in a terminal">
        <ul class="term__cmds">
          <li class="cmd"><code><span class="term__prompt" aria-hidden="true">$ </span><span data-cmd>brew install flarebox-dev/tap/flarebox</span></code><button class="copy" type="button" aria-live="polite">Copy</button></li>
          <li class="cmd"><code><span class="term__prompt" aria-hidden="true">$ </span><span data-cmd>flarebox setup</span></code><button class="copy" type="button" aria-live="polite">Copy</button></li>
        </ul>
        <ol class="term__log" data-run>
          <li style="--i: 0"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Logged in with Cloudflare</span></li>
          <li style="--i: 1"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Created the R2 bucket <b>flarebox</b></span></li>
          <li style="--i: 2"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Uploaded the Worker with <b>AccountDO</b> and <b>SpaceDO</b></span></li>
          <li style="--i: 3"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Serving at <b class="url">https://flarebox.example.workers.dev</b></span></li>
          <li style="--i: 4"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Claimed the server with a one-time secret</span></li>
          <li style="--i: 5"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Saved the device credentials and deleted the secret</span></li>
          <li style="--i: 6"><svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg><span>Revoked the Cloudflare login</span></li>
        </ol>
      </figure>
    </div>
  </section>
</main>

<footer class="site-foot">
  <div class="container">
    <p>Cloudflare, Workers, Durable Objects and R2 are trademarks of Cloudflare, Inc. Flarebox is not affiliated with or endorsed by Cloudflare, Inc.</p>
  </div>
</footer>

<script>
document.querySelectorAll('.cmd .copy').forEach((b) => {
  const cmd = b.closest('.cmd').querySelector('[data-cmd]');
  const text = cmd.textContent;
  const show = (label, name) => {
    b.textContent = label;
    b.setAttribute('aria-label', name);
    setTimeout(() => { b.textContent = 'Copy'; b.setAttribute('aria-label', 'Copy ' + text); }, 2400);
  };
  const fail = () => {
    getSelection().selectAllChildren(cmd);
    show('Copy failed', 'Could not copy. ' + text + ' is selected, so copy it with your keyboard.');
  };
  b.setAttribute('aria-label', 'Copy ' + text);
  b.addEventListener('click', () => {
    if (!navigator.clipboard) return fail();
    navigator.clipboard.writeText(text).then(() => show('Copied', 'Copied ' + text), fail);
  });
});
const run = document.querySelector('[data-run]');
if (run && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
  run.classList.add('is-waiting');
  new IntersectionObserver(([e], io) => { if (e.isIntersecting) { run.classList.remove('is-waiting'); io.disconnect(); } }).observe(run);
}
</script>
</body>
</html>
