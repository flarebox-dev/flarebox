# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-ffi"
description = "Bindings for the native desktop apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
koidrive-driver = { path = "../driver" }
koidrive-net = { path = "../net" }
koidrive-proto = { path = "../proto" }
koidrive-telemetry = { path = "../telemetry" }
thiserror = "2.0.21"
tokio = { version = "1.48", features = ["net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
uniffi = "0.32"
url = "2.5.8"

[dev-dependencies]
koidrive-store = { path = "../store" }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full"] }
