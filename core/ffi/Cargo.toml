# SPDX-License-Identifier: Apache-2.0

[package]
name = "flarebox-ffi"
description = "Bindings for the native desktop apps."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["lib", "staticlib"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
flarebox-driver = { path = "../driver" }
flarebox-net = { path = "../net" }
flarebox-proto = { path = "../proto" }
thiserror = "2.0.21"
tokio = { version = "1.48", features = ["net", "rt-multi-thread", "time"] }
tracing = "0.1.41"
uniffi = "0.32"

[dev-dependencies]
flarebox-store = { path = "../store" }
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.145"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full"] }
