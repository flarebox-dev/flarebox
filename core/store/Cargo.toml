[package]
name = "flarebox-store"
description = "Local SQLite state for a synced space."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flarebox-engine = { path = "../engine" }
flarebox-fs = { path = "../fs" }
flarebox-proto = { path = "../proto" }
prost.workspace = true
rusqlite = { version = "0.41.1", features = ["bundled", "fallible_uint"] }
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
