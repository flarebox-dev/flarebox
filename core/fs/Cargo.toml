[package]
name = "flarebox-fs"
description = "File system watchers and local file access."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
notify = "8.2.2"
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
rustix = { version = "1.1.6", features = ["process"] }
tempfile = "3.27.0"
