# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-driver"
description = "Runs sync for the folders a device links: credentials, configuration, server sessions and disk observation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
koidrive-chunk = { path = "../chunk" }
koidrive-engine = { path = "../engine", features = ["serde"] }
koidrive-fs = { path = "../fs" }
koidrive-ignore = { path = "../ignore" }
koidrive-net = { path = "../net" }
koidrive-proto = { path = "../proto" }
koidrive-store = { path = "../store" }
koidrive-telemetry = { path = "../telemetry" }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.41"
url = "2.5.8"

[dev-dependencies]
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
koidrive-sim = { path = "../sim" }
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full", "test-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
