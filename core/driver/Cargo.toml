# SPDX-License-Identifier: Apache-2.0

[package]
name = "flarebox-driver"
description = "Runs sync for the folders a device links: credentials, configuration, server sessions and disk observation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes = "1.12.1"
flarebox-chunk = { path = "../chunk" }
flarebox-engine = { path = "../engine" }
flarebox-fs = { path = "../fs" }
flarebox-net = { path = "../net" }
flarebox-proto = { path = "../proto" }
flarebox-store = { path = "../store" }
rustix = { version = "1.1.6", features = ["fs", "process"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.48", features = ["macros", "rt", "sync", "time"] }
toml = "1.1.8"
tracing = "0.1.41"
url = "2.5.8"

[dev-dependencies]
prost.workspace = true
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full", "test-util"] }
