[package]
name = "koidrive-ignore-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
koidrive-engine = { path = "../../engine" }
koidrive-ignore = { path = ".." }
libfuzzer-sys = "0.4"

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# Not a member of the repository's workspace: it needs a nightly toolchain and cargo-fuzz.
[workspace]
