# SPDX-License-Identifier: Apache-2.0

[package]
name = "flarebox-net"
description = "HTTP and WebSocket client for a Flarebox server."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = "0.23.1"
bytes = "1.12.1"
fastrand = "2"
flarebox-proto = { path = "../proto" }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
prost.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.48", features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing = "0.1.41"
url = "2.5.8"

[dev-dependencies]
proptest = "1.12.0"
tokio = { version = "1.48", features = ["full", "test-util"] }
