[package]
name = "flarebox-engine"
description = "Sync state machine and conflict rules, free of I/O."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
flarebox-ignore = { path = "../ignore" }
flarebox-proto = { path = "../proto" }
