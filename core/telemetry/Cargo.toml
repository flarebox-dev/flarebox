# SPDX-License-Identifier: Apache-2.0

[package]
name = "koidrive-telemetry"
description = "Opt-in usage reports: what is recorded, where it waits on disk and how it is sent."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
getrandom = "0.4.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "json"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tracing = "0.1.41"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.48", features = ["full"] }
